name: Capture GPL posts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay runs a little)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feed and archive new posts
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: python capture.py
      - name: Commit if anything changed
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "Capture posts $(date -u +%FT%TZ)"
          git push
