<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPL Outage Tracker</title>
<!--
  Built with the dashboard-design skill (github.com/abdiraimov-otabek/dashboard-design-skill).
  Deviations, on purpose:
  - Plain HTML/CSS/SVG, no React/Tailwind: Tailwind classes translated to CSS on the same tokens.
  - The subtitle is a full sentence because the owner asked for that exact line.
  - "Outages" counts outage posts, not distinct outages: GPL doesn't give outage IDs or end times.
  - Days before tracking started are drawn as "not tracked", never as zero.
-->
<style>
:root{color-scheme:light;
  --page:#f8f8f6;--card:#fff;--soft:#f1f1ef;--ink:#17171a;--ink-2:#48484d;--muted:#66666d;
  --line:rgb(0 0 0/.075);--line-strong:rgb(0 0 0/.14);
  --accent:#3e63dd;--accent-rgb:62 99 221;--up:#0f7f57;--down:#d23f45;--warn:#c98a00;--warn-rgb:201 138 0;
  --tip:#1f2530;--live:#12a150;
  --seq0:#eef4fc;--seq1:#cde2fb;--seq2:#9ec5f4;--seq3:#5598e7;--seq4:#256abf;--seq5:#104281;--bar:#2a78d6;
  --on3:#fff;--on4:#fff;--on5:#fff;--sea:#e9f1fb;--land:#fbfbf9;--bolt:#f5b800;
  --shadow-card:0 1px 2px rgb(0 0 0/.04),0 1px 1px rgb(0 0 0/.02)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#0b0b0d;--card:#141417;--soft:#1c1c20;--ink:#f3f3f5;--ink-2:#c4c4ca;--muted:#8c8c95;
  --line:rgb(255 255 255/.08);--line-strong:rgb(255 255 255/.16);
  --accent:#7b96ff;--accent-rgb:123 150 255;--up:#34c48b;--down:#ff6b70;--warn:#f6b100;--warn-rgb:246 177 0;--tip:#2a3548;
  --seq0:#1b2433;--seq1:#0d366b;--seq2:#184f95;--seq3:#256abf;--seq4:#3987e5;--seq5:#86b6ef;--bar:#3987e5;
  --on3:#fff;--on4:#0b0b0d;--on5:#0b0b0d;--sea:#0f1620;--land:#1a1a1e;--bolt:#ffc928}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px}
@media (min-width:1800px){.wrap{max-width:1640px}}
button{font:inherit;color:inherit}

/* header */
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);margin:2px 0 0}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);color:var(--ink-2);font-size:13px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.dot.stale{background:var(--warn)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.seg button{border:0;background:none;height:26px;padding:0 11px;border-radius:999px;color:var(--ink-2);font-size:13px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg button:focus-visible,.tile:focus-visible,.row:focus-visible,.post>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sample + filters */
.banner{display:flex;gap:10px;align-items:center;border:1px dashed var(--line-strong);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.banner b{letter-spacing:.06em;font-size:11px;color:var(--ink)}
.banner a{color:var(--ink-2)}
.chips{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px;position:sticky;top:0;z-index:5;background:var(--page);padding:8px 0}
.chips.on{display:flex}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:999px;border:1px solid rgb(var(--accent-rgb)/.25);background:rgb(var(--accent-rgb)/.08);color:var(--ink);font-size:13px;cursor:pointer}
.chip span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--muted)}
.chip:hover span{background:rgb(var(--accent-rgb)/.15);color:var(--ink)}
.chips .clear{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:0 4px}
.chips .n{color:var(--muted);font-size:13px;margin-left:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card);padding:20px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:28px}
.ct h2{font-size:15px;font-weight:600;margin:0}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px}
.legend .gap{width:8px}
@media (max-width:639px){.ct .legend{display:none}}

/* KPI strip: separate cards, they report and filter */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media (max-width:639px){.kpis .tile:last-child:nth-child(odd){grid-column:span 2}}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(5,1fr)}}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-card);padding:8px;cursor:pointer}
.tile>div{border-radius:11px;padding:10px 10px 9px;height:100%}
.tile:hover>div{background:rgb(0 0 0/.025)}
.tile[aria-pressed="true"]>div{background:rgb(var(--accent-rgb)/.06);box-shadow:inset 0 0 0 1px rgb(var(--accent-rgb)/.2)}
.tile .k{font-size:13px;color:var(--ink-2)}
.tile[aria-pressed="true"] .k{color:var(--ink);font-weight:500}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:4px 0 2px}
.tile .d{font-size:12px;color:var(--muted);font-weight:500}
.d.bad{color:var(--down)}.d.good{color:var(--up)}
.tile.warn .v{color:var(--warn)}

/* panels */
.duo{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media (min-width:1024px){.duo{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.duo .card{min-width:0}
#cal{max-width:560px}
/* map */
#map{position:relative}
#map svg{overflow:hidden;border-radius:12px;background:var(--sea)}
.land{fill:var(--land);stroke:var(--line-strong);stroke-width:.8;vector-effect:non-scaling-stroke}
.mk{cursor:pointer}
.mk .ring{fill:none;stroke:var(--bolt);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.mk .bolt{animation:flash 1.2s steps(1,end) infinite}
.mk:hover .disc{stroke:var(--ink)}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@keyframes flash{0%,62%{opacity:1}70%,78%{opacity:.25}86%{opacity:1}}
@media (prefers-reduced-motion:reduce){.mk .ring,.mk .bolt{animation:none}}
.mapnote{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--card);border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.main{margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media (min-width:1024px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1800px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg text{fill:var(--muted);font-size:11px}
.hit{cursor:pointer}

/* ranked list */
.rhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 10px 6px}
.row{display:grid;grid-template-columns:1fr auto 44px;gap:10px;align-items:center;position:relative;height:42px;padding:0 10px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:rgb(0 0 0/.03)}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right}
.row .pct{text-align:right;color:var(--muted);font-size:12px}
.row .bar{position:absolute;left:10px;right:10px;bottom:5px;height:6px;border-radius:3px;background:var(--seq0)}
.row .bar i{display:block;height:100%;border-radius:3px;background:var(--bar)}
.row:hover .bar i{filter:brightness(1.1)}
.row.grey .bar i{background:var(--muted)}
.row.on{background:rgb(var(--accent-rgb)/.06);box-shadow:inset 0 0 0 1px rgb(var(--accent-rgb)/.2)}
.more{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px 10px 0;text-decoration:underline}

/* posts */
.search{width:100%;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:0 12px;font:inherit;margin-bottom:6px}
.post{border-top:1px solid var(--line)}
.post>summary{list-style:none;display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:baseline;padding:11px 4px;cursor:pointer}
.post>summary::-webkit-details-marker{display:none}
.post .t{color:var(--muted);font-size:13px}
.post .ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .tags{display:flex;gap:4px}
.tag{font-size:12px;height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.tag.del{background:rgb(var(--warn-rgb)/.16);color:var(--ink)}
.post .body{white-space:pre-wrap;color:var(--ink-2);padding:0 4px 14px 134px}
.post .body a{color:var(--muted)}
@media (max-width:639px){
  .post>summary{grid-template-columns:1fr auto}
  .post .t{grid-column:1/-1;margin-bottom:-6px}
  .post .body{padding-left:4px}
}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.foot{color:var(--muted);font-size:12px;margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}

/* tooltip: one system, dark */
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--tip);color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:260px;opacity:0;transition:opacity .08s;box-shadow:0 12px 32px -8px rgb(0 0 0/.3)}
.tip .big{font-size:16px;font-weight:600}
.tip .mut{color:rgb(255 255 255/.65)}

/* states */
.skel{background:var(--soft);border-radius:12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>GPL Outage Tracker</h1>
      <p class="sub">Let's see how often this blackout really happening...</p>
    </div>
    <div class="pills">
      <span class="pill" id="updated" title="When the last check finished"><span class="dot"></span><span>Loading</span></span>
      <div class="seg" id="range" role="group" aria-label="Range">
        <button data-d="7">7d</button><button data-d="30" aria-pressed="true">30d</button><button data-d="90">90d</button><button data-d="0">All</button>
      </div>
    </div>
  </header>
  <div id="banner"></div>
  <div class="chips" id="chips"></div>

  <section class="kpis" id="kpis" aria-label="Totals"></section>

  <section class="duo">
  <div class="card">
    <div class="ct"><h2 id="calTitle" data-tip="Outage posts per day, Guyana time. Restoration and update posts aren't counted. Tap a day to filter.">Outages by day</h2>
      <div class="legend" id="calLegend"></div></div>
    <div id="cal"></div>
  </div>
  <div class="card">
    <div class="ct"><h2 data-tip="Places named in outage posts. Bigger bolts mean more posts. Positions are approximate. Tap a bolt to filter.">On the map</h2>
      <div class="seg" id="mapMode" role="group" aria-label="Map view"><button data-m="fit" aria-pressed="true">Outages</button><button data-m="all">All Guyana</button></div></div>
    <div id="map"></div>
  </div>
  </section>

  <section class="grid">
    <div class="card"><div class="ct"><h2 data-tip="Outage posts per region or area. Tap a row to filter.">Where</h2>
      <div class="seg" id="geo" role="group" aria-label="Group by"><button data-g="region" aria-pressed="true">Region</button><button data-g="areas">Area</button></div></div>
      <div id="where"></div></div>
    <div class="card"><div class="ct"><h2 data-tip="The reason GPL gave in the post. Tap a row to filter.">Reason given</h2></div>
      <div id="reasons"></div></div>
  </section>

  <section class="card main">
    <div class="ct"><h2 data-tip="Unplanned outage posts by the weekday and hour they were posted, Guyana time. Tap a cell to filter.">Time of day</h2>
      <div class="legend" id="todLegend"></div></div>
    <div id="tod"></div>
  </section>

  <section class="card" id="postsCard">
    <div class="ct"><h2>Posts</h2><span class="legend num" id="postCount"></span></div>
    <input class="search" id="q" type="search" placeholder="Search" aria-label="Search posts">
    <div id="posts"></div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
// ---------- basics
const GY=-4*3600e3;                                   // Guyana: UTC-4, no DST
const gy=t=>new Date(new Date(t).getTime()+GY);       // read with getUTC*
const dayKey=t=>gy(t).toISOString().slice(0,10);
const todayKey=()=>new Date(Date.now()+GY).toISOString().slice(0,10);
const addDays=(k,n)=>new Date(Date.parse(k+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const niceDay=k=>new Date(k+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const shortDay=k=>new Date(k+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const OUT={unplanned:"Unplanned",planned:"Planned","load-shedding":"Load shedding"};   // outage post types
const isOut=p=>!!OUT[p.type];
const isDemo=new URLSearchParams(location.search).has("demo");

// ---------- tooltip
const tip=document.getElementById("tip");
function showTip(el){const h=el.dataset.tip;if(!h)return;tip.innerHTML=h;tip.style.opacity=1;
  const r=el.getBoundingClientRect(),t=tip.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2,y=r.top-t.height-8;
  x=Math.max(8,Math.min(x,innerWidth-t.width-8));if(y<8)y=r.bottom+8;
  tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.opacity=0}
document.addEventListener("pointerover",e=>{const el=e.target.closest("[data-tip]");el?showTip(el):hideTip()});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");el?showTip(el):hideTip()});
addEventListener("scroll",hideTip,{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});

// ---------- state
let ALL=[],DAYS=30,GEO="region",SHOW_ALL={where:false,reasons:false},POSTS_SHOWN=15,UPDATED=null,TRACK=null;
const F={};   // active filters, one per key

function filterDef(k,v){switch(k){
  case"kind":return{label:{outage:"All outages",unplanned:"Unplanned",planned:"Planned","load-shedding":"Load shedding",noreason:"No reason given",deleted:"Deleted by GPL"}[v],
    fn:{outage:isOut,unplanned:p=>p.type==="unplanned",planned:p=>p.type==="planned","load-shedding":p=>p.type==="load-shedding",
        noreason:p=>isOut(p)&&(p.cause||"No reason given")==="No reason given",deleted:p=>!!p.deleted_from_source}[v]};
  case"day":return{label:niceDay(v),fn:p=>dayKey(p.when)===v};
  case"slot":{const[wd,h,span]=v.split("-").map(Number);const hh=x=>String(x).padStart(2,"0");
    return{label:`${WD[wd]} ${hh(h)}:00–${hh(h+span-1)}:59`,fn:p=>{const d=gy(p.when);return d.getUTCDay()===wd&&d.getUTCHours()>=h&&d.getUTCHours()<h+span}}}
  case"region":return{label:v,fn:p=>(p.region||"Not stated")===v};
  case"areas":return{label:v,fn:p=>(p.areas||[]).includes(v)};
  case"cause":return{label:v,fn:p=>isOut(p)&&(p.cause||"No reason given")===v};
}}
function toggle(k,v){if(F[k]&&F[k].v===v)delete F[k];else F[k]={v,...filterDef(k,v)};POSTS_SHOWN=15;hideTip();render()}
function isOn(k,v){return F[k]&&F[k].v===v}
document.addEventListener("click",e=>{const el=e.target.closest("[data-f]");if(!el)return;
  const s=el.dataset.f,i=s.indexOf("|");toggle(s.slice(0,i),s.slice(i+1))});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".row[data-f]")){e.preventDefault();e.target.click()}});

// range: [start, today]; the tracked part starts at TRACK
function rangeStart(){return DAYS?addDays(todayKey(),-(DAYS-1)):(TRACK||todayKey())}
function inWindow(p,a,b){const k=dayKey(p.when);return k>=a&&k<=b}
function applyF(list,skip){return list.filter(p=>Object.entries(F).every(([k,f])=>k===skip||f.fn(p)))}

// ---------- load
function demo(){
  const areas=["Kitty","Sophia","Diamond to Grove","Providence","Enmore","New Amsterdam","Linden","Campbellville","Parika","Anna Regina to Charity","Ogle","Bounty Hall to Charity"];
  const regs=["East Bank Demerara","East Coast Demerara","West Demerara","Georgetown","Berbice","Essequibo Coast"];
  const causes=["No reason given","No reason given","No reason given","Equipment failure","Third-party contact","Trees & vegetation","System disturbance","Weather"];
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;const out=[];const now=Date.now();
  for(let d=0;d<75;d++){const n=Math.floor(r()*4.2);for(let i=0;i<n;i++){
    const x=r(),type=x<.7?"unplanned":x<.9?"planned":"load-shedding";
    const hr=type==="planned"?7+Math.floor(r()*3):(r()<.6?17+Math.floor(r()*5):Math.floor(r()*24));
    const t=new Date(now-d*864e5);t.setUTCHours(hr+4,Math.floor(r()*60),0,0);if(t>now)t.setUTCDate(t.getUTCDate()-1);
    const reg=regs[Math.floor(r()*regs.length)],ar=areas[Math.floor(r()*areas.length)];
    out.push({id:`s${d}-${i}`,published:t.toISOString(),captured_at:t.toISOString(),type,region:reg,areas:[ar],
      cause:type==="planned"?"Planned works":causes[Math.floor(r()*causes.length)],deleted_from_source:r()<.35,
      title:`ADVISORY – SERVICE INTERRUPTION (${reg.toUpperCase()})`,text:`SAMPLE. Customers from ${ar} are experiencing an interruption.`});}}
  out.push({id:"s-other",published:new Date(now-2*864e5).toISOString(),captured_at:new Date(now-2*864e5).toISOString(),type:"other",title:"SMART METERS ARE COMING",text:"SAMPLE notice."});
  return out;
}
function skeleton(){
  document.getElementById("kpis").innerHTML=Array(5).fill('<div class="skel" style="height:104px"></div>').join("");
  ["cal","where","reasons","tod"].forEach(id=>document.getElementById(id).innerHTML='<div class="skel" style="height:160px"></div>');
}
async function load(){
  skeleton();
  try{
    if(isDemo){ALL=demo();UPDATED=new Date();}
    else{const res=await fetch("data/posts.json",{cache:"no-store"});
      if(!res.ok)throw new Error(res.status);
      ALL=await res.json();const lm=res.headers.get("last-modified");UPDATED=lm?new Date(lm):null;}
  }catch(e){
    document.getElementById("banner").innerHTML=`<div class="banner">Couldn't load the saved posts. <a href="">Try again</a></div>`;
    ALL=[];
  }
  ALL.forEach(p=>{p.when=p.published||p.captured_at;if(/^gpl/i.test(p.region||""))p.region=null});
  ALL=ALL.filter(p=>p.when).sort((a,b)=>a.when<b.when?1:-1);
  const caps=ALL.map(p=>p.captured_at).filter(Boolean).sort();
  TRACK=caps.length?dayKey(caps[0]):null;
  if(isDemo){TRACK=addDays(todayKey(),-74);
    document.getElementById("banner").innerHTML=`<div class="banner"><b>SAMPLE</b><span>Made-up posts</span><a href="./">Hide sample</a></div>`}
  render();
}

// ---------- render
function render(){
  const a=rangeStart(),b=todayKey(),from=TRACK&&TRACK>a?TRACK:a;   // tracked part of the range
  const inRange=ALL.filter(p=>inWindow(p,from,b));
  const S=applyF(inRange);                                           // everything that matches
  const O=S.filter(isOut);                                           // outage posts that match
  updatedPill();chips(S.length);kpis(from,b,O,S);cal(a,b,applyF(inRange,"day").filter(isOut));
  ranked("where",GEO==="region"?O.map(p=>[p.region||"Not stated"]):O.map(p=>p.areas||[]),GEO,O.length);
  ranked("reasons",O.map(p=>[p.cause||"No reason given"]),"cause",O.length);
  tod(applyF(inRange,"slot").filter(p=>p.type==="unplanned"));
  map(O);
  posts(S);foot();
}

function updatedPill(){
  const el=document.getElementById("updated");
  if(isDemo){el.innerHTML='<span class="dot"></span><span>Sample</span>';el.dataset.tip="";return}
  if(!UPDATED){el.innerHTML='<span class="dot stale"></span><span>Not checked yet</span>';return}
  const m=Math.round((Date.now()-UPDATED)/6e4),txt=m<1?"just now":m<60?`${m}m ago`:m<1440?`${Math.round(m/60)}h ago`:`${Math.round(m/1440)}d ago`;
  el.innerHTML=`<span class="dot${m>60?" stale":""}"></span><span>Updated ${txt}</span>`;
  el.dataset.tip=`<div class="big">${esc(UPDATED.toLocaleString("en-GB",{timeZone:"America/Guyana",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</div><div class="mut">${m>60?"Checks normally run every 15 minutes. The server may be down.":"Last time new posts were saved"}</div>`;
}

function chips(n){
  const el=document.getElementById("chips"),E=Object.entries(F);el.classList.toggle("on",E.length>0);
  el.innerHTML=E.map(([k,f])=>`<button class="chip" data-f="${esc(k)}|${esc(f.v)}" aria-label="Remove ${esc(f.label)}">${esc(f.label)}<span>✕</span></button>`).join("")+
    `<span class="n num">${n} post${n===1?"":"s"}</span><button class="clear" id="clr">Clear</button>`;
  const c=document.getElementById("clr");if(c)c.onclick=()=>{Object.keys(F).forEach(k=>delete F[k]);render()};
}

function kpis(from,to,O,S){
  // previous period of the same length, same filters, only if it was fully tracked
  const len=Math.round((Date.parse(to)-Date.parse(from))/864e5)+1;
  const pa=addDays(from,-len),pb=addDays(from,-1),havePrev=DAYS&&TRACK&&TRACK<=pa&&!F.day;
  const P=havePrev?applyF(ALL.filter(p=>inWindow(p,pa,pb))).filter(isOut):[];
  const cnt=(L,fn)=>L.filter(fn).length;
  const T=[
    ["outage","Outages",isOut,"bad"],
    ["unplanned","Unplanned",p=>p.type==="unplanned","bad"],
    ["planned","Planned",p=>p.type==="planned","neutral"],
    ["noreason","No reason given",p=>(p.cause||"No reason given")==="No reason given","bad"],
    ["deleted","Deleted by GPL",p=>!!p.deleted_from_source,"neutral"],
  ];
  const days=len,tracking=!DAYS||TRACK>rangeStart();
  document.getElementById("kpis").innerHTML=T.map(([k,label,fn,sense])=>{
    const src=k==="deleted"?S:O,v=cnt(src,fn);
    let d="",cls="",tipx="";
    if(k==="deleted"){d=O.length?`of ${O.length}`:"—";tipx=`Posts GPL took down after we saved them. A post counts as deleted when it's gone from GPL's page on two checks in a row.`}
    else if(havePrev){const pv=cnt(k==="outage"?P:P,fn);
      if(pv<5){d=`was ${pv}`}
      else{const ch=Math.round((v-pv)/pv*100);d=(ch===0?"±0%":`${ch>0?"▲":"▼"} ${Math.abs(ch)}%`)+" vs prev";
        cls=sense==="neutral"||ch===0?"":(ch>0?"bad":"good")}tipx=`${pv} in the previous ${days} days`}
    else{d=TRACK?`since ${shortDay(TRACK)}`:"—";tipx=TRACK?`Tracking started ${niceDay(TRACK)}, so there's no earlier period to compare with yet.`:""}
    if(k==="noreason"){const u=O.length;tipx=`${u?Math.round(v/u*100):0}% of outage posts didn't say what caused it. `+tipx}
    if(k==="outage")tipx=`${(v/days).toFixed(1)} a day over ${days} tracked day${days===1?"":"s"}. `+tipx;
    const warn=k==="deleted"&&v>0?" warn":"";
    return `<button class="tile${warn}" data-f="kind|${k}" aria-pressed="${isOn("kind",k)}" data-tip="${esc(`<div class="big num">${v}</div><div class="mut">${tipx}</div>`)}">
      <div><div class="k">${label}</div><div class="v num">${v}</div><div class="d num ${cls}">${d}</div></div></button>`}).join("");
}

// tiers: five blue steps, relative to the busiest cell on screen
const tierOf=(n,max)=>n<=0?0:Math.max(1,Math.ceil(n/Math.max(1,max)*5));
const tierBg=t=>`var(--seq${t})`;
const tierInk=t=>t>=3?`var(--on${t})`:"var(--ink)";
const tierSub=t=>t>=3?`var(--on${t})`:"var(--muted)";
// small "power off" mark: a lightning bolt with a slash, drawn in ink so it survives greyscale
const boltOff=(x,y,c="var(--ink)")=>`<g transform="translate(${x} ${y})" aria-hidden="true"><path d="M7.5 0.5 2 7h3.6L4.5 11.5 10 5H6.4z" fill="${c}"/><path d="M1 1l10 10" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/></g>`;
function legend(id,labels,untracked){document.getElementById(id).innerHTML=
  `<span>${labels[0]}</span>`+[0,1,2,3,4,5].map(t=>`<i style="background:${tierBg(t)}"></i>`).join("")+`<span>${labels[1]}</span>`+
  (untracked?`<span class="gap"></span><i style="border:1px dashed var(--line-strong)"></i><span>Not tracked</span>`:"")}

function cal(a0,b,O){
  const el=document.getElementById("cal");
  const monday=k=>addDays(k,-((new Date(k+"T12:00:00Z").getUTCDay()+6)%7));
  // don't draw weeks before tracking started; only the first tracked week keeps its dashed days
  const a=TRACK&&TRACK>a0?(monday(TRACK)>a0?monday(TRACK):a0):a0;
  legend("calLegend",["Fewer","More"],TRACK&&TRACK>a);
  const by={};O.forEach(p=>{const k=dayKey(p.when);(by[k]=by[k]||{n:0}).n++;by[k][p.type]=(by[k][p.type]||0)+1});
  const max=Math.max(1,...Object.values(by).map(v=>v.n));
  const startMon=monday(a);
  const weeks=Math.ceil((Math.round((Date.parse(b)-Date.parse(startMon))/864e5)+1)/7);
  const W=Math.max(300,el.clientWidth);
  const cellTip=(k,v)=>{if(TRACK&&k<TRACK)return `<div class="big">Not tracked</div><div class="mut">${niceDay(k)} · before tracking started</div>`;
    return `<div class="big num">${v?v.n:0} outage post${v&&v.n===1?"":"s"}</div><div class="mut">${niceDay(k)}${v?"<br>"+Object.keys(OUT).filter(t=>v[t]).map(t=>`${OUT[t]} ${v[t]}`).join(" · "):""}</div>`};
  let s="";
  if(weeks<=6){ // month calendar: rows are weeks
    const gap=W<500?4:5,cw=Math.min(76,(W-gap*6)/7),T=18;
    const ch=Math.round(Math.min(cw*.9,Math.max(W<500?40:44,(250-T)/weeks-gap))),H=T+weeks*(ch+gap);  // short ranges get taller days
    const w7=cw*7+gap*6;
    s=`<svg viewBox="0 0 ${w7} ${H}" style="max-width:${w7}px" role="img" aria-label="Outage posts by day">`;
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach((d,c)=>s+=`<text x="${c*(cw+gap)+4}" y="11">${d}</text>`);
    for(let w=0;w<weeks;w++)for(let c=0;c<7;c++){
      const k=addDays(startMon,w*7+c);if(k<a||k>b)continue;
      const v=by[k],n=v?v.n:0,x=c*(cw+gap),y=T+w*(ch+gap),untr=TRACK&&k<TRACK,today=k===b,on=isOn("day",k);
      const lab=(new Date(k+"T12:00:00Z").getUTCDate()===1||k===a)?shortDay(k):new Date(k+"T12:00:00Z").getUTCDate();
      s+=untr?`<rect x="${x+.5}" y="${y+.5}" width="${cw-1}" height="${ch-1}" rx="9" fill="none" stroke="var(--line-strong)" stroke-dasharray="3 3"/>`
             :`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="8" fill="${tierBg(tierOf(n,max))}"${on?` stroke="var(--ink)" stroke-width="2"`:""}/>`;
      const t=untr?0:tierOf(n,max);
      s+=`<text x="${x+7}" y="${y+14}" style="fill:${today?(t>=3?tierInk(t):"var(--accent)"):tierSub(t)};${today?"font-weight:700;text-decoration:underline":""}">${lab}</text>`;
      if(n)s+=`<text x="${x+cw-7}" y="${y+ch-7}" text-anchor="end" class="num" style="fill:${tierInk(t)};font-size:13px;font-weight:700">${n}</text>`;
      if(t===5&&n>=4&&cw>=44)s+=boltOff(x+cw-7-(String(n).length*8)-14,y+ch-19,tierInk(t));   // worst days: blackout icon
      s+=`<rect class="hit" x="${x}" y="${y}" width="${cw}" height="${ch}" fill="transparent" ${untr?"":`data-f="day|${k}"`} data-tip="${esc(cellTip(k,v))}"/>`;
    }
  }else{ // long range: columns are weeks, rows are weekdays
    const L=30,gap=3,cs=Math.max(8,Math.min(22,(W-L)/weeks-gap)),T=16,H=T+7*(cs+gap);
    s=`<svg viewBox="0 0 ${Math.min(W,L+weeks*(cs+gap))} ${H}" style="max-width:${L+weeks*(cs+gap)}px" role="img" aria-label="Outage posts by day">`;
    ["Mon","","Wed","","Fri","","Sun"].forEach((d,r)=>d&&(s+=`<text x="0" y="${T+r*(cs+gap)+cs/2+4}">${d}</text>`));
    let lastM=-1;
    for(let w=0;w<weeks;w++)for(let r=0;r<7;r++){
      const k=addDays(startMon,w*7+r);if(k<a||k>b)continue;
      const v=by[k],n=v?v.n:0,x=L+w*(cs+gap),y=T+r*(cs+gap),untr=TRACK&&k<TRACK,m=new Date(k+"T12:00:00Z").getUTCMonth();
      if(r===0&&m!==lastM){lastM=m;s+=`<text x="${x}" y="10">${new Date(k+"T12:00:00Z").toLocaleDateString("en-GB",{month:"short",timeZone:"UTC"})}</text>`}
      s+=untr?`<rect x="${x+.5}" y="${y+.5}" width="${cs-1}" height="${cs-1}" rx="3" fill="none" stroke="var(--line-strong)" stroke-dasharray="2 2"/>`
             :`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${tierBg(tierOf(n,max))}"${isOn("day",k)?` stroke="var(--ink)" stroke-width="2"`:""}/>`;
      s+=`<rect class="hit" x="${x}" y="${y}" width="${cs}" height="${cs}" fill="transparent" ${untr?"":`data-f="day|${k}"`} data-tip="${esc(cellTip(k,v))}"/>`;
    }
  }
  el.innerHTML=s+"</svg>";
}

function ranked(id,lists,key,total){
  const el=document.getElementById(id),c={};lists.forEach(l=>l.forEach(x=>c[x]=(c[x]||0)+1));
  let rows=Object.entries(c).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
  if(!rows.length){el.innerHTML='<div class="empty">Outage posts show up here once they come in</div>';return}
  const all=rows.length,max=rows[0][1],lim=SHOW_ALL[id]?rows.length:8;rows=rows.slice(0,lim);
  const col=id==="where"?(GEO==="region"?"Region":"Area"):"Reason";
  const multi=id==="where"&&GEO==="areas";
  el.innerHTML=`<div class="rhead"><span>${col}</span><span>Outage posts</span></div>`+rows.map(([name,v])=>{
    const share=total?v/total*100:0,pct=share<.1?"<0.1%":Math.round(share)+"%",grey=/^(No reason given|Not stated)$/.test(name);
    return `<div class="row${grey?" grey":""}${isOn(key,name)?" on":""}" role="button" tabindex="0" data-f="${key}|${esc(name)}"
      data-tip="${esc(`<div class="big num">${v}</div><div class="mut">${esc(name)} · ${pct} of outage posts</div>`)}">
      <span class="name">${esc(name)}</span><span class="val num">${v}</span><span class="pct num">${pct}</span>
      <span class="bar"><i style="width:${v/max*100}%"></i></span></div>`}).join("")+
    (all>8?`<button class="more" data-more="${id}">${SHOW_ALL[id]?"Show fewer":`Show all ${all}`}</button>`:"")+
    (multi?`<div class="rhead" style="padding-top:8px" data-tip="One post can name several areas, so these add up to more than the total.">Shares can add up past 100%</div>`:"");
  const m=el.querySelector("[data-more]");if(m)m.onclick=()=>{SHOW_ALL[id]=!SHOW_ALL[id];render()};
}

function tod(U){
  const el=document.getElementById("tod"),W=Math.max(300,el.clientWidth),span=W<640?3:1,cols=24/span;
  legend("todLegend",["Fewer","More"]);
  const g=Array.from({length:7},()=>Array(cols).fill(0));
  U.forEach(p=>{const d=gy(p.when);g[d.getUTCDay()][Math.floor(d.getUTCHours()/span)]++});
  const max=Math.max(1,...g.flat());
  const L=36,gap=span>1?5:3,cw=(W-L)/cols-gap,ch=span>1?30:22,T=4,H=T+7*(ch+gap)+18,hh=x=>String(x).padStart(2,"0");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unplanned outage posts by weekday and hour">`;
  [1,2,3,4,5,6,0].forEach((wd,r)=>{const y=T+r*(ch+gap);
    s+=`<text x="0" y="${y+ch/2+4}">${WD[wd]}</text>`;
    for(let c=0;c<cols;c++){const v=g[wd][c],x=L+c*(cw+gap),h0=c*span,key=`${wd}-${h0}-${span}`;
      const t=tierOf(v,max);
      s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="${span>1?8:5}" fill="${tierBg(t)}"${isOn("slot",key)?` stroke="var(--ink)" stroke-width="2"`:""}/>`;
      if(t>=4&&cw>=16)s+=`<text x="${x+cw/2}" y="${y+ch/2+4}" text-anchor="middle" class="num" style="fill:${tierInk(t)};font-weight:700">${v}</text>`;
      s+=`<rect class="hit" x="${x}" y="${y}" width="${cw}" height="${ch}" fill="transparent" data-f="slot|${key}" data-tip="${esc(`<div class="big num">${v} unplanned</div><div class="mut">${WD[wd]} ${hh(h0)}:00–${hh(h0+span-1)}:59</div>`)}"/>`;}});
  const ticks=span>1?[0,6,12,18,21]:[0,6,12,18,23];
  ticks.forEach(h=>{const c=Math.floor(h/span);s+=`<text x="${L+c*(cw+gap)+cw/2}" y="${H-3}" text-anchor="middle">${hh(h)}h</text>`});
  el.innerHTML=U.length?s+"</svg>":'<div class="empty">No unplanned outage posts in this range</div>';
}

function posts(S){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const L=S.filter(p=>!q||[p.title,p.text,p.cause,p.region,...(p.areas||[])].join(" ").toLowerCase().includes(q));
  document.getElementById("postCount").textContent=`${L.length}`;
  const label={...OUT,restored:"Restored",update:"Update",other:"Other"};
  document.getElementById("posts").innerHTML=L.length?L.slice(0,POSTS_SHOWN).map(p=>{const d=gy(p.when),k=dayKey(p.when);
    const head=(p.title||p.text||"").split("\n")[0].replace(/\s+/g," ").slice(0,140);
    const where=(p.areas||[]).join(", ");
    const title=isOut(p)&&(where||p.region)?(where||p.region):head;
    const meta=isOut(p)?[where?p.region:null,p.cause].filter(Boolean).join(" · "):"";
    return `<details class="post"><summary>
      <span class="t num">${shortDay(k)} · ${d.toISOString().slice(11,16)}</span>
      <span style="min-width:0"><div class="ttl">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:""}</span>
      <span class="tags">${p.type!=="unplanned"?`<span class="tag">${label[p.type]||"Other"}</span>`:""}${p.deleted_from_source?'<span class="tag del" data-tip="Gone from GPL\'s page. Saved here.">Deleted</span>':""}</span>
      </summary><div class="body">${esc(p.text||"")}${p.link?`\n\n<a href="${esc(p.link)}" target="_blank" rel="noopener">Open on Facebook</a>`:""}</div></details>`}).join("")+
    (L.length>POSTS_SHOWN?`<button class="more" id="morePosts">Show ${Math.min(30,L.length-POSTS_SHOWN)} more</button>`:"")
    :`<div class="empty">${ALL.length?"No posts match":"Posts appear here after the first check runs"}</div>`;
  const m=document.getElementById("morePosts");if(m)m.onclick=()=>{POSTS_SHOWN+=30;posts(S)};
}

function foot(){
  const rules=[...new Set(ALL.map(p=>p.rules).filter(Boolean))].join(", ");
  document.getElementById("foot").innerHTML=`<span class="num">${ALL.length} posts saved</span>`+
    (TRACK?`<span>Tracking since ${niceDay(TRACK)}</span>`:"")+(rules?`<span>Rules ${esc(rules)}</span>`:"");
}

    return pts.length?[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length]:null}
  for(const part of [name,...name.split(",").reverse()]){const p=look(part);if(p)return p}
  return null;
}
let MAPMODE="fit",MAPZOOM=null;
function map(O){
  const el=document.getElementById("map"),W=Math.max(300,el.clientWidth);
  // side by side: match the calendar's height so neither card has a gap; stacked: a 4:3 map
  const side=innerWidth>=1024,calH=document.getElementById("cal").clientHeight;
  const H=Math.round(side?Math.max(240,Math.min(calH,W*.85)):Math.max(260,Math.min(W*.8,420)));
  // points: every known place a post names, else its region
  const at={};let unplaced=0;
  O.forEach(p=>{let hits=(p.areas||[]).map(a=>[a,placeOf(a),"areas"]).filter(h=>h[1]);
    if(!hits.length&&p.region&&REGION_PT[p.region])hits=[[p.region,REGION_PT[p.region],"region"]];
    if(!hits.length){unplaced++;return}
    const seen=new Set();hits.forEach(([n,pt,k])=>{if(seen.has(n))return;seen.add(n);(at[n]=at[n]||{n:0,pt,k,name:n}).n++})});
  const pts=Object.values(at);
  // view: fit the outages (with room around them), the whole country, or a tapped cluster
  let bb;
  const all=[1.15,9.0,-61.45,-56.45];                  // [minLat,maxLat,minLon,maxLon]
  if(MAPZOOM)bb=MAPZOOM;
  else if(MAPMODE==="all"||!pts.length)bb=all;
  else{let la=pts.map(p=>p.pt[0]),lo=pts.map(p=>p.pt[1]);bb=[Math.min(...la),Math.max(...la),Math.min(...lo),Math.max(...lo)];
    const span=Math.max(.45,bb[1]-bb[0],(bb[3]-bb[2])*Math.cos(.12));
    const cl=(bb[0]+bb[1])/2,cn=(bb[2]+bb[3])/2,h=span*.62;bb=[cl-h,cl+h,cn-h/Math.cos(.12),cn+h/Math.cos(.12)]}
  const k=Math.cos((bb[0]+bb[1])/2*Math.PI/180);
  const sx=W/((bb[3]-bb[2])*k),sy=H/(bb[1]-bb[0]),sc=Math.min(sx,sy);
  const ox=(W-(bb[3]-bb[2])*k*sc)/2,oy=(H-(bb[1]-bb[0])*sc)/2;
  const X=lon=>ox+(lon-bb[2])*k*sc,Y=lat=>oy+(bb[1]-lat)*sc;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of outage locations">`;
  GUY.forEach(g=>g.r.forEach(r=>{let d="";for(let i=0;i<r.length;i+=2)d+=(i?"L":"M")+X(r[i]).toFixed(1)+" "+Y(r[i+1]).toFixed(1);
    s+=`<path class="land" d="${d}Z" data-tip="${esc(`<div class="big">${g.n}</div>`)}"/>`}));
  // group bolts that would overlap on screen
  const R=n=>9+Math.min(14,Math.sqrt(n)*3.2),cl=[];
  pts.sort((a,b)=>b.n-a.n).forEach(p=>{const x=X(p.pt[1]),y=Y(p.pt[0]);
    const c=cl.find(c=>Math.hypot(c.x-x,c.y-y)<R(c.n)+R(p.n)-4);
    if(c){c.items.push(p);c.n+=p.n}else cl.push({x,y,n:p.n,items:[p]})});
  cl.forEach((c,i)=>{const r=R(c.n),one=c.items.length===1,it=c.items[0];
    const tipx=`<div class="big num">${c.n} outage post${c.n===1?"":"s"}</div><div class="mut">${c.items.slice(0,6).map(t=>`${esc(t.name)} ${t.n}`).join("<br>")}${c.items.length>6?`<br>+${c.items.length-6} more`:""}<br>${one?"Tap to filter":"Tap to zoom in"}</div>`;
    const act=one?`data-f="${it.k}|${esc(it.name)}"`:`data-zoom="${c.items.map(t=>t.pt.join(",")).join(";")}"`;
    s+=`<g class="mk" ${act} data-tip="${esc(tipx)}" style="--d:${(i%7)*.17}s">
      <circle class="ring" cx="${c.x}" cy="${c.y}" r="${r}" style="animation-delay:var(--d)"/>
      <circle class="disc" cx="${c.x}" cy="${c.y}" r="${r}" fill="var(--bolt)" stroke="var(--card)" stroke-width="2"/>
      <g class="bolt" style="animation-delay:var(--d)"><path transform="translate(${c.x-r*.42} ${c.y-r*.62}) scale(${r*.084})" d="M6 0 0 6.2h3.4L2.4 12 9 4.6H5.4z" fill="#1d1d1f"/></g>
      ${c.n>1?`<text x="${c.x+r*.72}" y="${c.y-r*.6}" class="num" style="fill:var(--ink);font-weight:700;font-size:11px;paint-order:stroke;stroke:var(--card);stroke-width:3px">${c.n}</text>`:""}</g>`});
  s+="</svg>";
  el.innerHTML=s+(MAPZOOM?`<button class="mapnote" id="unzoom" style="left:auto;right:10px;cursor:pointer">Zoom out</button>`:"")+
    (unplaced?`<span class="mapnote num" data-tip="${esc(`<div class="mut">${unplaced} outage post${unplaced===1?"":"s"} named no place or region the map knows yet</div>`)}">${unplaced} not on map</span>`:"")+
    (!O.length?`<span class="mapnote">No outages in this view</span>`:"");
  el.querySelectorAll("[data-zoom]").forEach(g=>g.onclick=e=>{e.stopPropagation();
    const ps=g.dataset.zoom.split(";").map(t=>t.split(",").map(Number)),la=ps.map(p=>p[0]),lo=ps.map(p=>p[1]);
    const cl=(Math.min(...la)+Math.max(...la))/2,cn=(Math.min(...lo)+Math.max(...lo))/2,h=Math.max(.035,(Math.max(...la)-Math.min(...la))*.8,(Math.max(...lo)-Math.min(...lo))*.8);
    MAPZOOM=[cl-h,cl+h,cn-h,cn+h];hideTip();map(O)});
  const u=document.getElementById("unzoom");if(u)u.onclick=()=>{MAPZOOM=null;map(O)};
}
document.getElementById("mapMode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  MAPMODE=b.dataset.m;MAPZOOM=null;document.querySelectorAll("#mapMode button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});

// ---------- controls
document.getElementById("range").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  DAYS=+b.dataset.d;document.querySelectorAll("#range button").forEach(x=>x.setAttribute("aria-pressed",x===b));delete F.day;render()});
document.getElementById("geo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  GEO=b.dataset.g;document.querySelectorAll("#geo button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
document.getElementById("q").addEventListener("input",()=>{POSTS_SHOWN=15;render()});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,150)});
load();
</script>
